name: Compilar y Publicar Instaladores Oficiales (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nombre del Tag / Versión (ej. v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-windows:
    name: 🪟 Compilar AutoProd-Setup.exe (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r controlador/requirements.txt

      - name: Compilar Motor Local con PyInstaller
        working-directory: controlador
        run: |
          python -m PyInstaller --noconfirm --clean --onefile `
            --name "autoprod-motor" `
            --collect-all uvicorn `
            --collect-all fastapi `
            --collect-all pydantic `
            --collect-all requests `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all edge_tts `
            --hidden-import "routers.workspace" `
            --hidden-import "routers.chat" `
            --hidden-import "routers.video_looper" `
            --hidden-import "routers.subtitles" `
            --hidden-import "routers.tts" `
            --hidden-import "hardware" `
            main.py

      - name: Preparar Directorio dist/ y bin/
        run: |
          New-Item -ItemType Directory -Force -Path dist
          New-Item -ItemType Directory -Force -Path bin
          Copy-Item controlador/dist/autoprod-motor.exe dist/autoprod-motor.exe
          Remove-Item -Recurse -Force controlador/build -ErrorAction SilentlyContinue

      - name: Descargar Binarios Portables (FFmpeg y yt-dlp)
        shell: pwsh
        run: |
          Write-Host "Descargando yt-dlp..."
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile 'bin/yt-dlp.exe'

          Write-Host "Descargando FFmpeg..."
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile 'bin/ffmpeg.zip'
          Expand-Archive -Path 'bin/ffmpeg.zip' -DestinationPath 'bin/ffmpeg_temp' -Force
          Get-ChildItem -Path 'bin/ffmpeg_temp' -Filter 'ffmpeg.exe' -Recurse | Copy-Item -Destination 'bin/ffmpeg.exe'
          Get-ChildItem -Path 'bin/ffmpeg_temp' -Filter 'ffprobe.exe' -Recurse | Copy-Item -Destination 'bin/ffprobe.exe'
          Remove-Item -Recurse -Force 'bin/ffmpeg_temp'
          Remove-Item -Force 'bin/ffmpeg.zip'

      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compilar Instalador Gráfico (AutoProd-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts/installer/windows/setup.iss

      - name: Subir Artefacto de Windows
        uses: actions/upload-artifact@v4
        with:
          name: AutoProd-Setup-Windows
          path: dist/AutoProd-Setup.exe
          if-no-files-found: error

  build-macos:
    name: 🍎 Compilar AutoProd-Setup.dmg (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -r controlador/requirements.txt

      - name: Compilar Motor Local con PyInstaller
        working-directory: controlador
        run: |
          python -m PyInstaller --noconfirm --clean --onefile \
            --name "autoprod-motor" \
            --collect-all uvicorn \
            --collect-all fastapi \
            --collect-all pydantic \
            --collect-all requests \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --collect-all edge_tts \
            --hidden-import "routers.workspace" \
            --hidden-import "routers.chat" \
            --hidden-import "routers.video_looper" \
            --hidden-import "routers.subtitles" \
            --hidden-import "routers.tts" \
            --hidden-import "hardware" \
            main.py

      - name: Preparar Paquete y Binarios (macOS)
        run: |
          mkdir -p dist bin dist/AutoProdAI-macOS/bin dist/AutoProdAI-macOS/workspace
          cp controlador/dist/autoprod-motor dist/autoprod-motor
          chmod +x dist/autoprod-motor
          cp dist/autoprod-motor dist/AutoProdAI-macOS/

          # Descargar yt-dlp
          curl -sL "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" -o bin/yt-dlp || true
          chmod +x bin/yt-dlp 2>/dev/null || true
          cp bin/yt-dlp dist/AutoProdAI-macOS/bin/ 2>/dev/null || true

          # Instalar ffmpeg vía Homebrew en el runner macOS
          brew install ffmpeg || true
          cp $(which ffmpeg) dist/AutoProdAI-macOS/bin/ 2>/dev/null || true
          cp $(which ffprobe) dist/AutoProdAI-macOS/bin/ 2>/dev/null || true

          # Script de arranque
          printf '#!/bin/bash\nDIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"\ncd "$DIR"\nexport PATH="$DIR/bin:$PATH"\n./autoprod-motor\n' > dist/AutoProdAI-macOS/start_motor.sh
          chmod +x dist/AutoProdAI-macOS/start_motor.sh

      - name: Limpiar Espacio en Disco
        run: |
          rm -rf controlador/build
          rm -rf controlador/.pyinstaller
          rm -rf ~/Library/Caches/pip
          rm -rf ~/Library/Caches/pyinstaller
          brew cleanup --prune=all || true

      - name: Generar Instalador .DMG
        run: |
          hdiutil create -volname "AutoProd AI Motor" -srcfolder dist/AutoProdAI-macOS -ov -format UDZO dist/AutoProd-Setup.dmg

      - name: Subir Artefacto de macOS
        uses: actions/upload-artifact@v4
        with:
          name: AutoProd-Setup-macOS
          path: dist/AutoProd-Setup.dmg
          if-no-files-found: error

  publish-release:
    name: 🚀 Publicar en GitHub Releases
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Descargar Artefacto Windows
        uses: actions/download-artifact@v4
        with:
          name: AutoProd-Setup-Windows
          path: dist/

      - name: Descargar Artefacto macOS
        uses: actions/download-artifact@v4
        with:
          name: AutoProd-Setup-macOS
          path: dist/

      - name: Determinar Tag de Release
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ] && [ "${{ github.event.inputs.release_tag }}" != "latest" ]; then
            echo "TAG_NAME=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
          name: AutoProd AI Production IDE (${{ steps.get_tag.outputs.TAG_NAME }})
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/AutoProd-Setup.exe
            dist/AutoProd-Setup.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
